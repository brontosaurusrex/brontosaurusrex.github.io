<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en-us">

  {% include head.html %}

  <body class="layout-reverse">



    {% include sidebar.html %}

    <!-- Wrap is the content to shift when toggling the sidebar. We wrap the
         content to avoid any CSS collisions with our real content. -->
    <div class="wrap">
      <div class="masthead">
        <div class="container">
          <h3 class="masthead-title">
           <!-- <a href="/" title="Home">{{ site.title }}</a>
            <small>{{ site.tagline }}</small> < disabled by bronto--> 
          </h3> 
        </div>
        

            
      </div>
        <div class="container content">
          
          
          <!-- SVG links: head opens search, body opens home. -->
          <div class="brontologo">
            <object
              type="image/svg+xml"
              data="/public/brontolabs_links.svg"
              width="550"
              height="335"
              aria-label="Brontolabs: head opens search, body opens home">
              <a href="/">Home</a> · <a href="/search">Search</a>
            </object>
          </div>
          

          <!-- <a href="/"><div> -->


      
        {{ content }}

        
          
      </div>
      
      {% include brontofoot.html %}
      
    </div>

    <label for="sidebar-checkbox" class="sidebar-toggle"></label>

  </body>
</html>
